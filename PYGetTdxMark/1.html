<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
<script>
  var socket = io('ws://localhost:8601');

  socket.on('connect', function() {
    console.log('客户端链接到服务器');
    socket.send('Hello Server!');
  });

  socket.on('message', function(data) {
    console.log('客户端接收到来自服务器的消息:', data);
  });

  socket.on('disconnect', function() {
    console.log('客户端中断链接');
  });
</script>
</body>
</html>
